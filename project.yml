name: Souchastnik
options:
  bundleIdPrefix: dev.souchastnik
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    TARGETED_DEVICE_FAMILY: '1,2'
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    APP_GROUP_IDENTIFIER: group.dev.souchastnik.ios
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  Souchastnik:
    type: application
    platform: iOS
    sources:
      - iOS/App
      - iOS/Shared
      - Sources/SouchastnikCore
      - path: iOS/Resources
        buildPhase: resources
    dependencies:
      - target: SouchastnikKeyboard
        embed: true
      - framework: Vendor/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.souchastnik.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: iOS/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Souchastnik.entitlements
    scheme:
      gatherCoverageData: true
  SouchastnikKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - iOS/Keyboard
      - iOS/Shared
      - Sources/SouchastnikCore
      - path: iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.souchastnik.ios.keyboard
        INFOPLIST_FILE: iOS/Keyboard-Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Souchastnik.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
